name: Publish

# Publishes the npm package and the PyPI package when you push a version tag
# (e.g. `git tag v0.1.1 && git push --tags`), or manually via the Actions tab.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   NPM_TOKEN        - npm automation token (npmjs.com → Access Tokens → Automation)
#   PYPI_API_TOKEN   - PyPI API token (pypi.org → Account → API tokens)
#
# Bump the version in package.json AND python/pyproject.toml before tagging;
# npm/PyPI reject re-publishing an existing version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
